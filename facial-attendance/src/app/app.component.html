<!-- Full app shell (visible on non-auth routes) -->
<div *ngIf="!hideSidebar" class="app-shell">
  <app-navbar *ngIf="!hideSidebar"></app-navbar>
  <div *ngIf="!hideSidebar" class="burger-container">
    <button class="burger-btn" (click)="toggleSidebar()">
      <span *ngIf="!sidebarOpen">&#9776;</span>
      <span *ngIf="sidebarOpen">&#10005;</span>
    </button>
    <div class="burger-label"></div>
  </div>
  <app-profile-sidebar *ngIf="!hideSidebar" [isOpen]="sidebarOpen"></app-profile-sidebar>
  <div class="app-content">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Guest layout: when on /login or /registration show only the routed component full-screen -->
<div *ngIf="hideSidebar" class="guest-shell">
  <router-outlet></router-outlet>
</div>
