<div class="app-shell">
  <app-navbar *ngIf="!hideSidebar"></app-navbar>
  <div *ngIf="!hideSidebar" class="burger-container">
    <button class="burger-btn" (click)="toggleSidebar()">
      <span *ngIf="!sidebarOpen">&#9776;</span>
      <span *ngIf="sidebarOpen">&#10005;</span>
    </button>
    <div class="burger-label"></div>
  </div>
  <app-profile-sidebar [isOpen]="sidebarOpen"></app-profile-sidebar>
  <div class="app-content">
    <router-outlet></router-outlet>
  </div>
</div>
