<!-- Auth Layout -->
<div *ngIf="hideSidebar; else appLayout" class="guest-shell">
  <router-outlet></router-outlet>
</div>

<!-- Main App Layout -->
<ng-template #appLayout>
  <div class="app-shell">
    <app-navbar
      class="sidebar"
      [isOpen]="sidebarOpen"
      [class.closed]="!sidebarOpen">
    </app-navbar>

    <div class="main-area">
      <button class="burger-btn" (click)="toggleSidebar()">
        <span *ngIf="!sidebarOpen">&#9776;</span>
        <span *ngIf="sidebarOpen">&#10005;</span>
      </button>

      <div class="app-content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-template>
