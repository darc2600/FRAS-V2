Sample Angular (HTML layout sketch)
<div class="attendance-page">
  <!-- Top Bar -->
  <!-- <app-navbar></app-navbar> -->
  <header class="top-bar">
    <h1 style="display: flex; gap: 1rem; align-items: center;">
      <label style="position: relative;">
        Room:
        <input type="text" [(ngModel)]="roomSearch" (input)="onRoomSearchChange()" (focus)="showRoomDropdown = true" (blur)="onRoomInputBlur()" placeholder="Search room..." style="width: 120px;" autocomplete="off" />
        <ul *ngIf="showRoomDropdown && filteredRooms.length > 0" class="dropdown-list">
          <li *ngFor="let r of filteredRooms" (mousedown)="selectRoom(r)">{{r}}</li>
        </ul>
      </label>
      <label>
        Course-Section:
        <select [(ngModel)]="courseSection" (change)="onCourseSectionChange()">
          <option *ngFor="let cs of availableCourseSections" [value]="cs">{{cs}}</option>
        </select>
      </label>
    </h1>
  </header>

  <div class="main-content">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="clock">{{ currentTime }}</div>
      <div class="webcam">
        <webcam [trigger]="triggerObservable" (imageCapture)="handleImage($event)"></webcam>
        <button (click)="triggerSnapshot()">Capture Image</button>
      </div>
      <button (click)="markAttendance()">Mark Attendance</button>
      <button (click)="startAutoRecognition()" [disabled]="autoRecognitionActive">Start Auto Recognition</button>
      <button (click)="stopAutoRecognition()" [disabled]="!autoRecognitionActive">Stop Auto Recognition</button>
      <div class="message">{{ message }}</div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <h2>Attendance Log</h2>
      <table>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
        <tr *ngFor="let log of attendanceLogs">
          <td>{{ log.studentId }}</td>
          <td>{{ log.studentName }}</td>
          <td>{{ log.time | date:'hh:mm:ss a' }}</td>
          <td [ngClass]="getStatusClass(log.status)">{{ log.status }}</td>
        </tr>
      </table>
      <div *ngIf="attendanceLogs.length === 0">No attendance records yet.</div>
    </div>
  </div>
</div>
