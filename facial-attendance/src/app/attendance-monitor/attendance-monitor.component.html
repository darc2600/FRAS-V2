Sample Angular (HTML layout sketch)
<div class="attendance-page">
  <!-- Top Bar -->

  <header class="top-bar">
    <h1 style="display: flex; gap: 1rem; align-items: center;">
      <label>
        Room:
        <select [(ngModel)]="room" (change)="onRoomChange()">
          <option *ngFor="let r of availableRooms" [value]="r">{{r}}</option>
        </select>
      </label>
      <label>
        Course:
        <select [(ngModel)]="courseCode" (change)="onCourseChange()">
          <option *ngFor="let c of availableCourses" [value]="c">{{c}}</option>
        </select>
      </label>
      <label>
        Section:
        <select [(ngModel)]="section" (change)="fetchLogs()">
          <option *ngFor="let s of availableSections" [value]="s">{{s}}</option>
        </select>
      </label>
    </h1>
  </header>

  <div class="main-content">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="clock">{{ currentTime }}</div>
      <div class="webcam">
        <webcam [trigger]="triggerObservable" (imageCapture)="handleImage($event)"></webcam>
        <button (click)="triggerSnapshot()">Capture Image</button>
      </div>
      <button (click)="markAttendance()">Mark Attendance</button>
      <div class="message">{{ message }}</div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <h2>Attendance Log</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
        <tr *ngFor="let log of attendanceLogs">
          <td>{{ log.studentName }}</td>
          <td>{{ log.time | date:'hh:mm:ss a' }}</td>
          <td [ngClass]="getStatusClass(log.status)">{{ log.status }}</td>
        </tr>
      </table>
      <div *ngIf="attendanceLogs.length === 0">No attendance records yet.</div>
    </div>
  </div>
</div>
