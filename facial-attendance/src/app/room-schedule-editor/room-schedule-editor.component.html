
<div class="room-schedule-editor-main">
  <div class="editor-header">Scheduler Editor</div>
  <div class="editor-inputs">
    <div class="editor-field">
      <label>Room Number</label>
      <input [(ngModel)]="room" placeholder="e.g., 305">
    </div>
    <div class="editor-field">
      <label>Course Code</label>
      <input [(ngModel)]="courseCode" placeholder="e.g., IT123L">
    </div>
    <div class="editor-field">
      <label>Section</label>
      <input [(ngModel)]="section" placeholder="e.g., AM1">
    </div>
    <div class="editor-field">
      <label>Professor</label>
      <input [(ngModel)]="professor" placeholder="e.g., Lastname">
    </div>
    <div class="editor-actions">
      <button (click)="loadSchedule()" [disabled]="isLoading">
        <span *ngIf="isLoading">LOADING...</span>
        <span *ngIf="!isLoading">LOAD</span>
      </button>
      <button (click)="addSchedule()">ADD</button>
      <button (click)="deleteSchedule()">DELETE</button>
    </div>
  </div>
  <div *ngIf="message" class="editor-message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">{{message}}</div>
  <div class="schedule-grid">
    <table>
      <thead>
        <tr>
          <th></th>
          <th *ngFor="let day of days">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let slot of timeSlots; let row = index">
          <td class="time-label">{{ slot }}</td>
          <td *ngFor="let day of days; let col = index">
            <div class="cell" [class.filled]="grid[row][col]?.courseCode">
              <ng-container *ngIf="grid[row][col]?.courseCode">
                <b>{{ grid[row][col].courseCode }}</b><br>
                <span>{{ grid[row][col].section }}</span><br>
                <span>{{ grid[row][col].professor }}</span>
                <button class="cell-clear" (click)="clearCell(row, col); $event.stopPropagation()">✕</button>
              </ng-container>
              <ng-container *ngIf="!grid[row][col]?.courseCode">
                <span class="add" (click)="fillCell(row, col)">+</span>
              </ng-container>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <button class="editor-save-btn" (click)="saveSchedule()" [disabled]="isSaving">
    <span *ngIf="isSaving">SAVING...</span>
    <span *ngIf="!isSaving">Save Schedule</span>
  </button>
</div>
