<div class="password-reset-container">
  <div class="header-section">
    <h2>Password Reset</h2>
  </div>

  <!-- Success/Error Messages -->
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>

  <!-- Password Reset Form -->
  <div *ngIf="hasPermission('reset_passwords')" class="password-reset-form card">
    <div class="card-header">
      <h5>Reset User Password</h5>
      <p class="text-muted small">This will set the user's password to: <strong>Reset1234!</strong></p>
    </div>
    <div class="card-body">
      <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
        <div class="form-group">
          <label for="email">User Email *</label>
          <input
            type="email"
            id="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
            email
            placeholder="Enter user email address">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-success" [disabled]="!resetForm.form.valid || loading">
            <i class="fas fa-key"></i> {{ loading ? 'Resetting...' : 'Reset Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- No Permission Message -->
  <div *ngIf="!hasPermission('reset_passwords')" class="alert alert-warning">
    <h5>Access Denied</h5>
    <p>You don't have permission to reset passwords.</p>
  </div>
</div>
