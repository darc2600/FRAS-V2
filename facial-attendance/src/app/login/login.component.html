<div class="login-center">
  <div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()">
      <label>Email</label>
      <input type="text" [(ngModel)]="email" name="email" required>
    <label>Password</label>
    <div class="password-field" style="display:flex;align-items:center;gap:8px;">
      <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required>
      <button type="button" (click)="togglePasswordVisibility()" [attr.aria-pressed]="showPassword" aria-label="Toggle password visibility">
        {{ showPassword ? 'Hide' : 'Show' }}
      </button>
    </div>
    <button type="submit">Login</button>
  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="success" *ngIf="success">{{ success }}</div>
  </form>
  </div>
</div>
