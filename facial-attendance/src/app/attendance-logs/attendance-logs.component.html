<h2>Attendance Logs</h2>
<label>
  Room:
  <select [(ngModel)]="room">
    <option *ngFor="let r of availableRooms" [value]="r">{{r}}</option>
  </select>
</label>
<input type="text" placeholder="Course Code" [(ngModel)]="courseCode">
<input type="text" placeholder="Section" [(ngModel)]="section">
<button (click)="fetchLogs()">Fetch Logs</button>
<p>{{message}}</p>
<table *ngIf="logs.length">
  <tr>
    <th>Student ID</th>
    <th>Timestamp</th>
  </tr>
  <tr *ngFor="let log of logs">
    <td>{{log[0]}}</td>
    <td>{{log[1]}}</td>
  </tr>
</table>
