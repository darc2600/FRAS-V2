<div class="container py-4">
  <h2 class="mb-4">Attendance Logs</h2>
  <div class="row g-3 align-items-end mb-3">
    <div class="col-md-3">
      <label>Floor:</label>
      <select class="form-select" [(ngModel)]="selectedFloor" (change)="onFloorChange()">
        <option *ngFor="let f of dynamicFloors" [value]="f">Floor {{f}}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label>Room:</label>
      <select class="form-select" [(ngModel)]="room" (change)="onRoomChange()" [disabled]="!dynamicRooms.length">
        <option *ngFor="let r of dynamicRooms" [value]="r.room">{{r.room}}</option>
      </select>
      <div *ngIf="dynamicRooms.length === 0" class="text-danger small">No rooms for this floor.</div>
    </div>
    <div class="col-md-4">
      <label>Course-Section:</label>
      <select class="form-select" [(ngModel)]="courseSection" (change)="onCourseSectionChange()">
        <option *ngFor="let cs of availableCourseSections" [value]="cs">{{cs}}</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" (click)="fetchLogs()" [disabled]="loading">Fetch Logs</button>
    </div>
  </div>
  <div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>
  <div *ngIf="message && !loading" class="alert alert-info">{{message}}</div>
  <div *ngIf="logs.length" class="card mt-3">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Student ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let log of logs; let i = index">
            <td>{{i + 1}}</td>
            <td>{{log[0]}}</td>
            <td>{{log[1]}}</td>
            <td>{{ formatDateTime(log[2]).split(' ')[0] }}</td>
            <td>{{ formatDateTime(log[2]).split(' ')[1] + ' ' + formatDateTime(log[2]).split(' ')[2] }}</td>
            <td><span class="badge bg-success">{{ getStatus(log) }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
