<nav class="sidebar-navbar" [class.closed]="!isOpen">
  <div class="sidebar-logo">
    <img src="/assets/mapua-logo.png" alt="Mapua Logo" height="48" />
  </div>
  <div class="professor-card">
    <div class="professor-avatar">{{ userInitials }}</div>
    <div>
      <div class="professor-name">{{ userName }}</div>
      <div class="professor-role">{{ userRole }}</div>
    </div>
  </div>
  <ul class="sidebar-links">
    <li><a routerLink="/v2/classes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Classes</a></li>
    <li><a routerLink="/session-history" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Session History</a></li>
    <li><a routerLink="/v2/schedule" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Schedule</a></li>
  </ul>

  <div class="sidebar-footer">
    <button class="sidebar-logout-btn" (click)="logout()">Sign Out</button>
  </div>
</nav>
