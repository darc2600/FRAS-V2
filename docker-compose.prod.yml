services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SQLITE_DB_PATH=/app/data/attendance.db
      - DATASET_PATH=/app/dataset
    volumes:
      - ./data:/app/data
      # mount the host dataset directory (writable) and the repo into the container
      - /home/frasijbmapua/FRAS/dataset:/app/dataset:rw
      - ./:/app:rw
    ports:
      - "8000:8000"

  frontend:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./facial-attendance/dist/facial-attendance:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
