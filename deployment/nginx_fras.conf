# Nginx site config for FRAS
# Place at /etc/nginx/sites-available/fras and symlink to sites-enabled
server {
  listen 80;
  server_name fras-ijb.site www.fras-ijb.site;

  root /var/www/fras/browser;
  index index.html;

  # Serve static assets directly
  location /assets/ {
    try_files $uri $uri/ =404;
    access_log off;
    expires 30d;
  }

  # Health or simple static checks
  location /favicon.ico { try_files $uri =204; }

  # Proxy API requests to backend uvicorn
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # SPA fallback for Angular routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  access_log /var/log/nginx/fras.access.log;
  error_log /var/log/nginx/fras.error.log;
}
